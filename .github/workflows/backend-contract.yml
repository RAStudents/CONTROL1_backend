name: Backend contract
on: [push, pull_request, workflow_dispatch]
jobs:
  rust-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: control-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - run: python -m pip install -r requirements-quality.txt
      - run: python3 tests/architecture.py
      - run: python -m unittest discover -s tests -p test_quality.py -v
      - run: bash -n add-events.sh
      - run: python -m unittest discover -s tests -p test_demo.py -v
      - run: python scripts/sql_quality.py lint --output sql-quality.json
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked --all-targets --all-features
      - run: cargo test --workspace --locked --all-features
      - run: cargo doc --locked --no-deps
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Visible complexity review (advisory findings, compiler errors fail)
        run: python scripts/complexity_review.py --output quality-review.json
      - name: Start isolated integration topology
        run: |
          umask 077
          export POSTGRES_PASSWORD=$(openssl rand -hex 32)
          export JWT_SECRET=$(openssl rand -hex 32)
          export CURSOR_SECRET=$(openssl rand -hex 32)
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\nCURSOR_SECRET=%s\nCDN_HOSTS=cdn.example.test\n' "$POSTGRES_PASSWORD" "$JWT_SECRET" "$CURSOR_SECRET" > .env
          docker compose up --build -d
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: bash tests/session_affinity.sh
      - run: bash tests/migrations.sh
      - name: Validate dynamic SQL and capture controlled before/after plans
        run: python scripts/benchmark_queries.py --disposable --output query-plans.json
      - run: CONTROL_TEST_CANCEL=1 CONTROL_TEST_SNAPSHOT_LIMIT=1 python3 tests/compose_smoke.py
      - run: python3 tests/contract_regressions.py
      - run: python3 tests/access_faults.py
      - run: python3 tests/anchors.py
      - run: python3 tests/export_deadlines.py
      - run: python3 tests/retention.py
      - run: CONTROL_TEST_CRASH=1 python3 tests/worker_crash.py
      - run: CONTROL_TEST_NATS_OUTAGE=1 python3 tests/nats_recovery.py
      - name: Capture evidence
        if: always()
        run: docker compose logs --no-color > integration-services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-contract-evidence
          path: |
            integration-services.log
            sql-quality.json
            quality-review.json
            query-plans.json
      - if: always()
        run: docker compose --profile contract down -v
